version: '3.8'

services:
  rf-iq-analyst:
    build: .
    image: rf-iq-analyst:latest
    container_name: rf-iq-analyst
    environment:
      # For Windows X server (VcXsrv, Xming, etc.)
      - DISPLAY=host.docker.internal:0.0
      - QT_X11_NO_MITSHM=1
      - LIBGL_ALWAYS_INDIRECT=1
      # Audio support via PulseAudio
      - PULSE_SERVER=host.docker.internal:4713
      - XDG_RUNTIME_DIR=/tmp/runtime-analyst
    volumes:
      # Mount directory for input/output files
      - ./data:/home/analyst/data
      # Mount Windows user directories for file access
      - C:/Users:/mnt/windows/Users
      - C:/:/mnt/windows/C
      # Common data directories
      - ${USERPROFILE}/Documents:/mnt/windows/Documents
      - ${USERPROFILE}/Downloads:/mnt/windows/Downloads
      - ${USERPROFILE}/Desktop:/mnt/windows/Desktop
    # Use host network for easier X11 connection on Windows
    network_mode: "host"

  # Service with WSLg audio support (Windows 11 WSL2)
  rf-iq-analyst-wslg:
    build: .
    image: rf-iq-analyst:latest
    container_name: rf-iq-analyst-wslg
    environment:
      - DISPLAY=host.docker.internal:0.0
      - QT_X11_NO_MITSHM=1
      - LIBGL_ALWAYS_INDIRECT=1
      # WSLg audio configuration
      - PULSE_RUNTIME_PATH=/mnt/wslg/PulseAudio
      - PULSE_CLIENTCONFIG=/mnt/wslg/PulseAudio/client.conf
      - XDG_RUNTIME_DIR=/tmp/runtime-analyst
    volumes:
      - ./data:/home/analyst/data
      # Mount Windows user directories for file access
      - C:/Users:/mnt/windows/Users
      - C:/:/mnt/windows/C
      - ${USERPROFILE}/Documents:/mnt/windows/Documents
      - ${USERPROFILE}/Downloads:/mnt/windows/Downloads
      - ${USERPROFILE}/Desktop:/mnt/windows/Desktop
      - /mnt/wslg:/mnt/wslg
    devices:
      - /dev/snd:/dev/snd
    network_mode: "host"

  # Alternative service for Linux/macOS X11
  rf-iq-analyst-linux:
    build: .
    image: rf-iq-analyst:latest
    container_name: rf-iq-analyst-linux
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    volumes:
      # Mount X11 socket for GUI display (Linux/macOS)
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./data:/home/analyst/data
      # Mount common directories (adjust paths for your OS)
      - ${HOME}/Documents:/mnt/host/Documents
      - ${HOME}/Downloads:/mnt/host/Downloads
      - ${HOME}/Desktop:/mnt/host/Desktop
    
  # Alternative service for headless operation
  rf-iq-analyst-headless:
    build: .
    image: rf-iq-analyst:latest
    container_name: rf-iq-analyst-headless
    entrypoint: ["/bin/bash"]
    stdin_open: true
    tty: true
    volumes:
      - ./data:/home/analyst/data
      # Mount common directories for file access
      - ${HOME}/Documents:/mnt/host/Documents
      - ${HOME}/Downloads:/mnt/host/Downloads
      - ${HOME}/Desktop:/mnt/host/Desktop

networks:
  default:
    driver: bridge
